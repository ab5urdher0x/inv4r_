profile_id: cis-network-baseline
title: CIS-style network device hardening baseline
framework: CIS
version: "1.1"

# Configurable severity weights (data, not code). Unknown severities fall
# back to `default`. UNKNOWN results count half their weight against.
severity_weights:
  critical: 30
  high: 20
  medium: 12
  low: 6
  default: 10

controls:
  - id: CIS-1.1.1
    title: "Telnet management service must be disabled"
    severity: critical
    fact: management.telnet.enabled
    expect:
      status: ABSENT
    remediation:
      cisco-ios: ["configure terminal", "line vty 0 15", "transport input ssh", "end", "write memory"]
      juniper-junos: ["delete system services telnet", "commit"]
      # FortiOS 7.2 CLI: 'set allowaccess' takes the FULL current service list;
      # <allowed-services> is rebuilt from the interface's existing services
      # minus telnet. Reference: Fortinet Community technical tip 92241.
      fortinet-fortigate: ["config system interface", "edit <iface>", "set allowaccess <allowed-services>", "next", "end"]
      paloalto-panos: ["set deviceconfig system services telnet permitted-ip <none>"]
      arista-eos: ["configure", "management telnet", "shutdown", "end", "write memory"]

  - id: CIS-1.1.2
    title: "SSH must be enabled with protocol version 2"
    severity: high
    any_of:
      - fact: management.ssh.enabled
        expect: { status: PRESENT, value: true }
      - fact: management.ssh.version
        expect: { status: PRESENT, value: "2" }
    require_all: true
    remediation:
      cisco-ios: ["configure terminal", "ip ssh version 2", "end", "write memory"]
      juniper-junos: ["set system services ssh protocol-version v2", "commit"]
      fortinet-fortigate: ["config system global", "set strong-crypto enable", "end"]
      paloalto-panos: ["set deviceconfig system services ssh permitted-ip <mgmt-net>"]
      arista-eos: ["configure", "management ssh", "idle-timeout 10", "end", "write memory"]

  - id: CIS-1.1.3
    title: "Plain HTTP management must be disabled"
    severity: high
    fact: management.http.enabled
    expect:
      status: ABSENT
    remediation:
      cisco-ios: ["configure terminal", "no ip http server", "ip http secure-server", "end", "write memory"]
      juniper-junos: ["delete system services web-management http", "commit"]
      fortinet-fortigate: ["config system interface", "edit <iface>", "set allowaccess <allowed-services>", "next", "end"]
      paloalto-panos: ["delete deviceconfig system services http"]
      arista-eos: ["configure", "management api http-commands", "protocol https", "no protocol http", "end"]

  - id: CIS-1.2.1
    title: "AAA must be enabled for administrative access"
    severity: high
    fact: authentication.aaa.enabled
    expect:
      status: PRESENT
      value: true
    remediation:
      cisco-ios: ["configure terminal", "aaa new-model", "aaa authentication login default TACACS+ local", "end", "write memory"]
      juniper-junos: ["set system authentication-order tacplus", "set system login user auditor class super-user authentication encrypted-password \"<hash>\"", "commit"]
      fortinet-fortigate: ["config system admin", "edit <admin>", "set accprofile \"super_admin\"", "next", "end"]

  - id: CIS-1.3.1
    title: "Administrative session timeout must be configured (<= 10 minutes)"
    severity: medium
    fact: management.session_timeout
    expect:
      status: PRESENT
      operator: "<="
      value: 10
    remediation:
      cisco-ios: ["configure terminal", "line vty 0 15", "exec-timeout 10 0", "end", "write memory"]
      juniper-junos: ["set system login idle-timeout 10", "commit"]
      fortinet-fortigate: ["config system global", "set admintimeout 10", "end"]
      paloalto-panos: ["set deviceconfig system session-timeout <minutes>"]
      arista-eos: ["configure", "management ssh", "idle-timeout 10", "end"]

  - id: CIS-1.4.1
    title: "Management-plane ACL must restrict administrative access"
    severity: high
    fact: management.acl.present
    expect:
      status: PRESENT
      value: true
    remediation:
      cisco-ios: ["configure terminal", "ip access-list standard MGMT-ACL", "permit <mgmt-net> <wildcard>", "line vty 0 15", "access-class MGMT-ACL in", "end", "write memory"]
      juniper-junos: ["set policy-options prefix-list MGMT <mgmt-net>", "commit"]
      paloalto-panos: ["set deviceconfig system permitted-ip <mgmt-net>"]
      # FortiOS 7.2 = per-admin trusted hosts + local-in policy. Reference:
      # Fortinet Community technical tip 92241, section "Restrict logins from
      # trusted hosts" (config system admin / edit <name> /
      # set trusthost1 <net> <mask>). Verified against the FortiOS 7.x CLI;
      # the local-in policy note still needs operator review.
      fortinet-fortigate:
        - "config system admin"
        - "edit <admin>"
        - "set trusthost1 <mgmt-net> <wildcard>"
        - "next"
        - "end"
        - "# review: add a firewall local-in-policy to restrict management services at the dataplane"

  - id: CIS-2.1.1
    title: "Remote logging (syslog) must be configured"
    severity: high
    fact: logging.remote.enabled
    expect:
      status: PRESENT
      value: true
    remediation:
      cisco-ios: ["configure terminal", "logging host <syslog-ip>", "logging trap informational", "end", "write memory"]
      juniper-junos: ["set system syslog host <syslog-ip> any info", "commit"]
      fortinet-fortigate: ["config log syslogd setting", "set status enable", "set server <syslog-ip>", "end"]
      paloalto-panos: ["set shared log-settings syslog <profile> server <syslog-ip>"]
      arista-eos: ["configure", "logging host <syslog-ip>", "end", "write memory"]

  - id: CIS-3.1.1
    title: "SNMP v1/v2c communities must not be used (use SNMPv3)"
    severity: high
    fact: snmp.v1.v2c.enabled
    expect:
      status: ABSENT
    remediation:
      cisco-ios: ["configure terminal", "no snmp-server community <community>", "snmp-server group READONLY v3 priv", "end", "write memory"]
      # FortiOS 7.2 CLI Reference, "config system snmp community": delete the
      # detected community by its entry id (never a hard-coded 'delete 1').
      # SNMPv3 migration ('config system snmp user') is a separate step.
      fortinet-fortigate: ["config system snmp community", "delete <community-id>", "end", "# SNMPv3 replacement is a separate step: config system snmp user"]
      sonic: ["sonic-db-cli CONFIG_DB 'hdel SNMP|Community readonly-comm'"]

  - id: CIS-3.1.2
    title: "SNMPv3 must be configured where SNMP is required"
    severity: medium
    fact: snmp.v3.enabled
    expect:
      status: PRESENT
      value: true
    remediation:
      cisco-ios: ["configure terminal", "snmp-server group MONITOR v3 priv", "snmp-server user audit MONITOR v3 auth sha <authpw> priv aes 128 <privpw>", "end", "write memory"]
      juniper-junos: ["set snmp v3 usm local-engine user audit authentication-sha <authpw> privacy-aes128 <privpw>", "commit"]

  - id: CIS-4.1.1
    title: "Local credentials must use a strong one-way hash (type8/type9)"
    severity: critical
    fact: credential.storage_type
    scope: credential
    expect:
      status: PRESENT
      operator: "in"
      value: ["type8", "type9"]
    remediation:
      cisco-ios: ["configure terminal", "enable algorithm-type scrypt secret <new-secret>", "username <user> algorithm-type scrypt secret <new-secret>", "end", "write memory"]
      juniper-junos: ["set system root-authentication plain-text-password", "commit"]
      arista-eos: ["configure", "enable secret sha512 <new-secret>", "end", "write memory"]

  - id: CIS-4.1.2
    title: "No reversible (type-7) credential encoding must be in use"
    severity: high
    fact: credential.reversible.present
    expect:
      status: ABSENT
    remediation:
      cisco-ios: ["configure terminal", "no service password-encryption", "enable algorithm-type scrypt secret <new-secret>", "key config-key password-encrypt <key>", "end", "write memory"]

  - id: CIS-5.1.1
    title: "Management-access ACLs must terminate with an explicit deny"
    severity: medium
    applicable_when:
      fact: management.acl.applied
      expect: {status: PRESENT, value: true}
    fact: management.acl.terminal_action
    expect:
      status: PRESENT
      operator: "=="
      value: "explicit_deny"
    remediation:
      cisco-ios: ["configure terminal", "ip access-list extended <acl>", "deny ip any any", "end", "write memory"]
      paloalto-panos: ["set vsys <vsys> rulebase security rules deny-all-inbound ... action deny"]

  - id: CIS-6.1.1
    title: "Local logging buffer should be enabled"
    severity: low
    fact: logging.local.enabled
    expect:
      status: PRESENT
      value: true
    remediation:
      cisco-ios: ["configure terminal", "logging buffered 16384 informational", "end", "write memory"]
      arista-eos: ["configure", "logging buffered 8192 warnings", "end", "write memory"]

  - id: CIS-7.1.1
    title: "A route must be configured for management/monitoring reachability"
    severity: low
    fact: network.route.present
    expect:
      status: PRESENT
      value: true
    remediation:
      cisco-ios: ["configure terminal", "ip route 0.0.0.0 0.0.0.0 <gw>", "end", "write memory"]
      fortinet-fortigate: ["config router static", "edit 1", "set gateway <gw>", "set device <iface>", "next", "end"]
